site_name: fair-segmentation
site_url: https://nl-bioimaging.github.io/fair-segmentation/
site_description: FAIR segmentation pipeline including metadata integration

repo_name: fair-segmentation
repo_url: https://github.com/NL-BioImaging/fair-segmentation

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_submodules: true
            show_if_no_docstring: true

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - index.md

theme:
  name: material
  color_mode: auto
  user_color_mode_toggle: true
