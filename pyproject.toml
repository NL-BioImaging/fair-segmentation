[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-segmentation"
version = "0.1.0"
description = "FAIR organelle segmentation pipeline"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "jupyter",
    "ome-zarr",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]


