[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-segmentation"
version = "0.1.0"
description = "FAIR organelle segmentation pipeline"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "jupyter",
    "ome-zarr",
    "zarr",
    "rocrate>=0.15.0",
    "scikit-image",
    "tifffile",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]



[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
fair-segmentation = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
