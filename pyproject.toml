[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-segmentation"
version = "0.1.0"
description = "FAIR organelle segmentation pipeline"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.4",
    "matplotlib",
    "jupyter",
    "ome-zarr",
    "zarr>=3",
    "ngff-zarr[validate]",
    "tifffile",
    "scikit-image",
    "imaging-metadata-converter>=2.0.0",
    "fair-metadata-integration>=0.2.0",
]

[project.optional-dependencies]
napari = [
    "napari[all]>=0.6.0",
    "empanada-napari @ git+https://github.com/volume-em/empanada-napari.git@refs/pull/56/head",
    "napari-meta-tiff>=0.1.1",
]
dev = [
    "pytest",
    "ome-zarr-models",
    "black",
    "flake8",
]



[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
fair-segmentation = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
napari = { features = ["napari"], solve-group = "default" }

[tool.pixi.tasks]
