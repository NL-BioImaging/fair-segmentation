name: fair-segmentation-empanada-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy>=1.26.4
  - napari==0.6.6
  - matplotlib
  - jupyter
  - ome-zarr
  - zarr>=3
  - tifffile
  - scikit-image
